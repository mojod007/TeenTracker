<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="_fragments::adminHead('TRACE | Locations')"></head>

<body class="hold-transition sidebar-mini">
    <div class="wrapper">

        <nav th:replace="_fragments::adminNavbar"></nav>

        <aside th:replace="_fragments::adminSidebar('etablissements')"></aside>

        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1>Locations de la Zone <span th:text="${zone.nom}"></span></h1>
                        </div>
                        <div class="col-sm-6">
                            <ol class="breadcrumb float-sm-right">
                                <li class="breadcrumb-item"><a href="/">Accueil</a></li>
                                <li class="breadcrumb-item"><a href="/etablissements">Établissements</a></li>
                                <li class="breadcrumb-item"><a
                                        th:href="@{'/etablissement/' + ${zone.depot.etablissement.id} + '/depots'}">Dépôts</a>
                                </li>
                                <li class="breadcrumb-item"><a
                                        th:href="@{'/depots/' + ${zone.depot.id} + '/zones'}">Zones</a></li>
                                <li class="breadcrumb-item active">Locations</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Main content -->
            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">Liste des Locations</h3>
                                    <div class="card-tools">
                                        <a th:href="@{'/zones/' + ${zoneId} + '/locations/new'}"
                                            class="btn btn-primary btn-sm">
                                            <i class="fas fa-plus"></i> Nouveau
                                        </a>
                                    </div>
                                </div>
                                <div class="card-body table-responsive p-0">
                                    <table class="table table-hover text-nowrap">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Code</th>
                                                <th>Nom</th>
                                                <th>Type Gestion</th>
                                                <th>Hauteur (m)</th>
                                                <th>Largeur (m)</th>
                                                <th>Profondeur (m)</th>
                                                <th>Poids Max (kg)</th>
                                                <th>Description</th>
                                                <th>Actif</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="location : ${locations}">
                                                <td th:text="${location.id}"></td>
                                                <td th:text="${location.code}"></td>
                                                <td th:text="${location.nom}"></td>
                                                <td>
                                                    <span th:text="${location.typeGestion}" class="badge"
                                                        th:classappend="${location.typeGestion == 'FIFO' ? 'badge-success' : 
                                                                          (location.typeGestion == 'LIFO' ? 'badge-info' : 
                                                                          (location.typeGestion == 'FEFO' ? 'badge-warning' : 'badge-secondary'))}">
                                                    </span>
                                                </td>
                                                <td th:text="${location.height != null ? location.height + ' m' : '-'}">
                                                </td>
                                                <td th:text="${location.width != null ? location.width + ' m' : '-'}">
                                                </td>
                                                <td th:text="${location.depth != null ? location.depth + ' m' : '-'}">
                                                </td>
                                                <td
                                                    th:text="${location.weight != null ? location.weight + ' kg' : '-'}">
                                                </td>
                                                <td th:text="${location.description}"></td>
                                                <td>
                                                    <span th:if="${location.actif}"
                                                        class="badge badge-success">Oui</span>
                                                    <span th:if="${!location.actif}"
                                                        class="badge badge-danger">Non</span>
                                                </td>
                                                <td>
                                                    <a th:href="@{'/zones/' + ${zoneId} + '/locations/' + ${location.id} + '/edit'}"
                                                        class="btn btn-sm btn-info" title="Modifier">
                                                        <i class="fas fa-edit"></i>
                                                    </a>
                                                    <a th:href="@{'/zones/' + ${zoneId} + '/locations/' + ${location.id} + '/delete'}"
                                                        class="btn btn-sm btn-danger"
                                                        onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette location ?')"
                                                        title="Supprimer">
                                                        <i class="fas fa-trash"></i>
                                                    </a>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>



        <footer th:replace="_fragments::adminFooter"></footer>
    </div>

    <div th:replace="_fragments::adminScripts"></div>
</body>

</html>
