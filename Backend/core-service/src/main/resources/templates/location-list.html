<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="_fragments::adminHead('TRACE | Locations')"></head>

<body class="hold-transition sidebar-mini">
    <div class="wrapper">

        <nav th:replace="_fragments::adminNavbar"></nav>

        <aside th:replace="_fragments::adminSidebar('etablissements')"></aside>

        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1>Locations de la Zone <span th:text="${zone.nom}"></span></h1>
                        </div>
                        <div class="col-sm-6">
                            <ol class="breadcrumb float-sm-right">
                                <li class="breadcrumb-item"><a href="/">Accueil</a></li>
                                <li class="breadcrumb-item"><a href="/etablissements">Établissements</a></li>
                                <li class="breadcrumb-item"><a
                                        th:href="@{'/etablissement/' + ${zone.depot.etablissement.id} + '/depots'}">Dépôts</a>
                                </li>
                                <li class="breadcrumb-item"><a
                                        th:href="@{'/depots/' + ${zone.depot.id} + '/zones'}">Zones</a></li>
                                <li class="breadcrumb-item active">Locations</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Main content -->
            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">Liste des Locations</h3>
                                    <div class="card-tools">
                                        <a th:href="@{'/zones/' + ${zoneId} + '/locations/new'}"
                                            class="btn btn-primary btn-sm">
                                            <i class="fas fa-plus"></i> Nouveau
                                        </a>
                                    </div>
                                </div>
                                <div class="card-body table-responsive p-0">
                                    <table class="table table-hover text-nowrap">
                                        <thead>
                                            <tr>
                                                <th>Code</th>
                                                <th>Nom</th>
                                                <th>Adresse</th>
                                                <th>Type</th>
                                                <th>Gestion</th>
                                                <th>Statut</th>
                                                <th>Capacité</th>
                                                <th>Poids (kg)</th>
                                                <th>Code-barres</th>
                                                <th>Actif</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="location : ${locations}">
                                                <td th:text="${location.code}"><strong></strong></td>
                                                <td th:text="${location.nom}"></td>
                                                <td>
                                                    <span th:if="${location.allee != null or location.colonne != null or location.niveau != null}"
                                                        class="badge badge-secondary" style="font-size:0.9rem;">
                                                        <span th:text="${location.allee != null ? location.allee : '?'}"></span>-
                                                        <span th:text="${location.colonne != null ? location.colonne : '?'}"></span>-
                                                        <span th:text="${location.niveau != null ? location.niveau : '?'}"></span>-
                                                        <span th:text="${location.posteProfondeur != null ? location.posteProfondeur : '?'}"></span>
                                                    </span>
                                                    <span th:if="${location.allee == null and location.colonne == null and location.niveau == null}"
                                                        class="text-muted">—</span>
                                                </td>
                                                <td>
                                                    <span th:if="${location.typeEmplacement}" class="badge badge-primary"
                                                        th:text="${location.typeEmplacement.description}"></span>
                                                    <span th:if="${!location.typeEmplacement}" class="text-muted">—</span>
                                                </td>
                                                <td>
                                                    <span th:text="${location.typeGestion}" class="badge"
                                                        th:classappend="${location.typeGestion == 'FIFO' ? 'badge-success' : 
                                                                          (location.typeGestion == 'LIFO' ? 'badge-info' : 
                                                                          (location.typeGestion == 'FEFO' ? 'badge-warning' : 'badge-secondary'))}">
                                                    </span>
                                                </td>
                                                <td>
                                                    <span th:text="${location.statut.description}" class="badge"
                                                        th:classappend="${location.statut == 'LIBRE' ? 'badge-success' : 
                                                                          (location.statut == 'PARTIEL' ? 'badge-warning' : 
                                                                          (location.statut == 'OCCUPE' ? 'badge-danger' : 
                                                                          (location.statut == 'RESERVE' ? 'badge-info' : 
                                                                          (location.statut == 'BLOQUE' ? 'badge-dark' : 'badge-secondary'))))}">
                                                    </span>
                                                    <span th:if="${location.bloque}" class="badge badge-dark ml-1">
                                                        <i class="fas fa-lock"></i>
                                                    </span>
                                                </td>
                                                <td>
                                                    <span th:if="${location.capacitePalettes != null}"
                                                        th:text="${location.capacitePalettes + ' plt'}"
                                                        class="text-nowrap"></span>
                                                    <span th:if="${location.typePaletteAutorise != null}"
                                                        th:text="' (' + ${location.typePaletteAutorise} + ')'"
                                                        class="text-muted small"></span>
                                                    <span th:if="${location.capacitePalettes == null}"
                                                        class="text-muted">—</span>
                                                </td>
                                                <td class="text-nowrap">
                                                    <span th:text="${location.weight != null ? location.weight + ' max' : ''}"></span>
                                                    <span th:if="${location.poidsActuelKg != null}"
                                                        th:text="' / ' + ${location.poidsActuelKg} + ' act'"
                                                        class="text-muted small"></span>
                                                    <span th:if="${location.weight == null and location.poidsActuelKg == null}"
                                                        class="text-muted">—</span>
                                                </td>
                                                <td>
                                                    <span th:if="${location.codeBarre}"
                                                        class="text-monospace small"
                                                        th:text="${location.codeBarre}"></span>
                                                    <span th:if="${!location.codeBarre}" class="text-muted">—</span>
                                                </td>
                                                <td>
                                                    <span th:if="${location.actif}"
                                                        class="badge badge-success">Oui</span>
                                                    <span th:if="${!location.actif}"
                                                        class="badge badge-danger">Non</span>
                                                </td>
                                                <td class="text-nowrap">
                                                    <a th:href="@{'/zones/' + ${zoneId} + '/locations/' + ${location.id} + '/edit'}"
                                                        class="btn btn-sm btn-info" title="Modifier">
                                                        <i class="fas fa-edit"></i>
                                                    </a>
                                                    <a th:href="@{'/zones/' + ${zoneId} + '/locations/' + ${location.id} + '/delete'}"
                                                        class="btn btn-sm btn-danger"
                                                        onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette location ?')"
                                                        title="Supprimer">
                                                        <i class="fas fa-trash"></i>
                                                    </a>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <footer th:replace="_fragments::adminFooter"></footer>
    </div>

    <div th:replace="_fragments::adminScripts"></div>
</body>

</html>
