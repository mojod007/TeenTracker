<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="_fragments::adminHead('TRACE | Dépôts')"></head>

<body class="hold-transition sidebar-mini">
    <div class="wrapper">

        <nav th:replace="_fragments::adminNavbar"></nav>

        <aside th:replace="_fragments::adminSidebar"></aside>

        <div class="content-wrapper">
            <section class="content-header">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1>Dépôts de <span th:text="${etablissement.nom}"></span></h1>
                        </div>
                        <div class="col-sm-6">
                            <ol class="breadcrumb float-sm-right">
                                <li class="breadcrumb-item"><a href="/">Accueil</a></li>
                                <li class="breadcrumb-item"><a href="/etablissements">Établissements</a></li>
                                <li class="breadcrumb-item active">Dépôts</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Main content -->
            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">Liste des Dépôts</h3>
                                    <div class="card-tools">
                                        <a th:href="@{'/etablissement/' + ${etabId} + '/depots/new'}"
                                            class="btn btn-primary btn-sm">
                                            <i class="fas fa-plus"></i> Nouveau
                                        </a>
                                    </div>
                                </div>
                                <div class="card-body table-responsive p-0">
                                    <table class="table table-hover text-nowrap">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Code</th>
                                                <th>Nom</th>
                                                <th>Emplacement</th>
                                                <th>Actif</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="depot : ${depots}">
                                                <td th:text="${depot.id}"></td>
                                                <td th:text="${depot.code}"></td>
                                                <td th:text="${depot.nom}"></td>
                                                <td th:text="${depot.location}"></td>
                                                <td>
                                                    <span th:if="${depot.actif}" class="badge badge-success">Oui</span>
                                                    <span th:if="${!depot.actif}" class="badge badge-danger">Non</span>
                                                </td>
                                                <td>
                                                    <a th:href="@{'/depots/' + ${depot.id} + '/zones'}"
                                                        class="btn btn-warning btn-sm">
                                                        <i class="fas fa-map-marker-alt"></i> Zones
                                                    </a>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>



        <footer th:replace="_fragments::adminFooter"></footer>
    </div>

    <div th:replace="_fragments::adminScripts"></div>
</body>

</html>
