<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="adminHead(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">TRACE</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
</head>

<nav th:fragment="adminNavbar" class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
        <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
        </li>
        <li class="nav-item d-none d-sm-inline-block">
            <a href="/" class="nav-link">Accueil</a>
        </li>
    </ul>
    <ul class="navbar-nav ml-auto">
        <li class="nav-item">
            <div class="nav-link lang-selector" style="display:flex;gap:5px;">
                <a href="?lang=fr" th:classappend="${#locale.language == 'fr'} ? 'active' : ''"
                    style="padding:5px 10px;border-radius:3px;text-decoration:none;">
                    <i class="fas fa-flag"></i> FR
                </a>
                <a href="?lang=en" th:classappend="${#locale.language == 'en'} ? 'active' : ''"
                    style="padding:5px 10px;border-radius:3px;text-decoration:none;">
                    <i class="fas fa-flag"></i> EN
                </a>
            </div>
        </li>
        <li class="nav-item">
            <a class="nav-link" data-widget="fullscreen" href="#" role="button">
                <i class="fas fa-expand-arrows-alt"></i>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/logout" role="button">
                <i class="fas fa-sign-out-alt"></i>
            </a>
        </li>
    </ul>
</nav>

<aside th:fragment="adminSidebar" class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="/" class="brand-link">
        <i class="fas fa-cube brand-image img-circle elevation-3"
            style="opacity: .8; padding-top: 8px; padding-left: 8px;"></i>
        <span class="brand-text font-weight-light">TRACE Admin</span>
    </a>
    <div class="sidebar">
        <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu"
                data-accordion="false">
                <li class="nav-item">
                    <a href="/" class="nav-link"
                       th:classappend="${#httpServletRequest.requestURI == '/' ? 'active' : ''}">
                        <i class="nav-icon fas fa-tachometer-alt"></i>
                        <p>Tableau de bord</p>
                    </a>
                </li>
                <li class="nav-header">GESTION</li>
                <li class="nav-item">
                    <a href="/etablissements" class="nav-link"
                       th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/etablissement') ? 'active' : ''}">
                        <i class="nav-icon fas fa-building"></i>
                        <p>Établissements</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/products" class="nav-link"
                       th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/products') or #strings.startsWith(#httpServletRequest.requestURI, '/produits') or #strings.startsWith(#httpServletRequest.requestURI, '/produit') ? 'active' : ''}">
                        <i class="nav-icon fas fa-box"></i>
                        <p>Produits</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/gammes" class="nav-link"
                       th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/gammes') ? 'active' : ''}">
                        <i class="nav-icon fas fa-tags"></i>
                        <p>Gammes</p>
                    </a>
                </li>
                <li class="nav-header">SYSTÈME</li>
                <li class="nav-item">
                    <a href="/users" class="nav-link"
                       th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/users') ? 'active' : ''}">
                        <i class="nav-icon fas fa-users"></i>
                        <p>Utilisateurs</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/profiles" class="nav-link"
                       th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/profiles') ? 'active' : ''}">
                        <i class="nav-icon fas fa-user-tag"></i>
                        <p>Profils</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/permissions" class="nav-link"
                       th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/permissions') ? 'active' : ''}">
                        <i class="nav-icon fas fa-key"></i>
                        <p>Permissions</p>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</aside>

<footer th:fragment="adminFooter" class="main-footer">
    <div class="float-right d-none d-sm-block">
        <b>Version</b> 1.0.0
    </div>
    <strong>Copyright &copy; 2025 Trace Microservices.</strong> Tous droits réservés.
</footer>

<div th:fragment="adminScripts">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
</div>

</html>
