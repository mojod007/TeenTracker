<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="_fragments::adminHead('TRACE | Produit')"></head>

<body class="hold-transition sidebar-mini">
    <div class="wrapper">

        <nav th:replace="_fragments::adminNavbar"></nav>

        <aside th:replace="_fragments::adminSidebar"></aside>

        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1 th:text="${product.id == null ? 'Ajouter un Produit' : 'Modifier le Produit'}">
                                Formulaire</h1>
                        </div>
                        <div class="col-sm-6">
                            <ol class="breadcrumb float-sm-right">
                                <li class="breadcrumb-item"><a href="/">Accueil</a></li>
                                <li class="breadcrumb-item"><a href="/products">Produits</a></li>
                                <li class="breadcrumb-item active">Produit</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-md-10">
                            <div class="card card-primary">
                                <div class="card-header">
                                    <h3 class="card-title">Informations du Produit</h3>
                                </div>
                                <form th:action="@{/products/save}" th:object="${product}" method="post">
                                    <input type="hidden" th:field="*{id}" />
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-6">
                                                <div class="form-group">
                                                    <label for="code">Code</label>
                                                    <input type="text" th:field="*{code}" class="form-control" id="code"
                                                        placeholder="Ex: PRD-001" required>
                                                </div>
                                                <div class="form-group">
                                                    <label for="nom">Nom</label>
                                                    <input type="text" th:field="*{nom}" class="form-control" id="nom"
                                                        placeholder="Ex: Laptop Pro" required>
                                                </div>
                                                <div class="form-group">
                                                    <label for="prix">Prix (€)</label>
                                                    <input type="number" step="0.01" th:field="*{prix}"
                                                        class="form-control" id="prix" placeholder="Ex: 999.99"
                                                        required>
                                                </div>
                                                <div class="form-group">
                                                    <label for="gamme">Gamme</label>
                                                    <select th:field="*{gamme}" class="form-control" id="gamme">
                                                        <option value="">Sélectionner une gamme...</option>
                                                        <option th:each="g : ${gammes}" th:value="${g.id}"
                                                            th:text="${g.nom}">
                                                        </option>
                                                    </select>
                                                </div>
                                                <div class="form-group">
                                                    <label for="rang">Rang</label>
                                                    <input type="number" th:field="*{rang}" class="form-control"
                                                        id="rang" placeholder="Ex: 1">
                                                </div>
                                                <div class="form-group">
                                                    <label for="idTypePalPro">Type Palette</label>
                                                    <select th:field="*{idTypePalPro}" class="form-control"
                                                        id="idTypePalPro">
                                                        <option value="">Sélectionner un type de palette...</option>
                                                        <option th:each="tp : ${typePalettes}" th:value="${tp}"
                                                            th:text="${tp}">
                                                        </option>
                                                    </select>
                                                </div>
                                                <div class="form-group">
                                                    <label for="typeGestion">Type Gestion</label>
                                                    <select th:field="*{typeGestion}" class="form-control"
                                                        id="typeGestion">
                                                        <option value="">Sélectionner un type de gestion...</option>
                                                        <option th:each="tg : ${typeGestions}" th:value="${tg}"
                                                            th:text="${tg.getDescription()}">
                                                        </option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="row">
                                                    <div class="col-md-4">
                                                        <div class="form-group">
                                                            <label for="unibase">Unibase</label>
                                                            <input type="number" th:field="*{unibase}"
                                                                class="form-control" id="unibase" placeholder="1">
                                                        </div>
                                                    </div>
                                                    <div class="col-md-4">
                                                        <div class="form-group">
                                                            <label for="upal">Upal</label>
                                                            <input type="number" th:field="*{upal}" class="form-control"
                                                                id="upal" placeholder="50">
                                                        </div>
                                                    </div>
                                                    <div class="col-md-4">
                                                        <div class="form-group">
                                                            <label for="ucas">Ucas</label>
                                                            <input type="number" th:field="*{ucas}" class="form-control"
                                                                id="ucas" placeholder="10">
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="row">
                                                    <div class="col-md-6">
                                                        <div class="form-group">
                                                            <label for="minqu">Quantité Min</label>
                                                            <input type="number" step="0.01" th:field="*{minqu}"
                                                                class="form-control" id="minqu" placeholder="5.0">
                                                        </div>
                                                    </div>
                                                    <div class="col-md-6">
                                                        <div class="form-group">
                                                            <label for="maxqu">Quantité Max</label>
                                                            <input type="number" step="0.01" th:field="*{maxqu}"
                                                                class="form-control" id="maxqu" placeholder="100.0">
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="form-group">
                                                    <label for="peremption">Péremption (jours)</label>
                                                    <input type="number" th:field="*{peremption}" class="form-control"
                                                        id="peremption" placeholder="Ex: 365">
                                                </div>
                                                <div class="form-group">
                                                    <label for="grammage">Grammage</label>
                                                    <input type="number" step="0.01" th:field="*{grammage}"
                                                        class="form-control" id="grammage" placeholder="Ex: 500.0">
                                                </div>
                                                <div class="form-group mt-4">
                                                    <div class="custom-control custom-switch">
                                                        <input type="checkbox" th:field="*{actif}"
                                                            class="custom-control-input" id="actif">
                                                        <label class="custom-control-label" for="actif">Produit
                                                            Actif</label>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label for="description">Description</label>
                                            <textarea th:field="*{description}" class="form-control" id="description"
                                                rows="3" placeholder="Description du produit..."></textarea>
                                        </div>
                                    </div>

                                    <div class="card-footer text-right">
                                        <a href="/products" class="btn btn-default">Annuler</a>
                                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>



        <footer th:replace="_fragments::adminFooter"></footer>
    </div>

    <div th:replace="_fragments::adminScripts"></div>
</body>

</html>
