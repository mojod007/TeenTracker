<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="_fragments::adminHead('TRACE | Produits')"></head>

<body class="hold-transition sidebar-mini">
    <div class="wrapper">

        <nav th:replace="_fragments::adminNavbar"></nav>

        <aside th:replace="_fragments::adminSidebar"></aside>

        <div class="content-wrapper">
            <section class="content-header">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1>Gestion des Produits</h1>
                        </div>
                        <div class="col-sm-6 text-right">
                            <a href="/products/add" class="btn btn-success">
                                <i class="fas fa-plus"></i> Ajouter un Produit
                            </a>
                        </div>
                    </div>
                </div><!-- /.container-fluid -->
            </section>

            <!-- Main content -->
            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-12">
                            <div class="card card-primary card-outline">
                                <div class="card-header">
                                    <h3 class="card-title">Liste des Produits</h3>
                                </div>
                                <!-- /.card-header -->
                                <div class="card-body table-responsive p-0">
                                    <table class="table table-hover text-nowrap">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Code</th>
                                                <th>Nom</th>
                                                <th>Gamme</th>
                                                <th>Prix</th>
                                                <th>Actif</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="p : ${products}">
                                                <td th:text="${p.id}">1</td>
                                                <td><span class="badge badge-info" th:text="${p.code}">CODE</span></td>
                                                <td th:text="${p.nom}">NOM</td>
                                                <td th:text="${p.gamme != null ? p.gamme.nom : '-'}">GAMME</td>
                                                <td th:text="${p.prix != null ? p.prix + ' €' : '0.00 €'}">0.00 €</td>
                                                <td>
                                                    <span th:if="${p.actif}" class="badge badge-success">Oui</span>
                                                    <span th:unless="${p.actif}" class="badge badge-danger">Non</span>
                                                </td>
                                                <td>
                                                    <div style="display: flex; gap: 8px;">
                                                        <a th:href="@{'/products/edit/' + ${p.id}}"
                                                            class="btn btn-xs btn-warning">
                                                            <i class="fas fa-edit"></i>
                                                        </a>
                                                        <a th:href="@{'/products/delete/' + ${p.id}}"
                                                            class="btn btn-xs btn-danger"
                                                            onclick="return confirm('Supprimer ce produit ?')">
                                                            <i class="fas fa-trash"></i>
                                                        </a>
                                                    </div>
                                                </td>
                                            </tr>
                                            <tr th:if="${#lists.isEmpty(products)}">
                                                <td colspan="7" class="text-center">Aucun produit trouvé.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <!-- /.card-body -->
                            </div>
                            <!-- /.card -->
                        </div>
                    </div>
                </div><!-- /.container-fluid -->
            </section>
            <!-- /.content -->
        </div>
        <!-- /.content-wrapper -->



        <footer th:replace="_fragments::adminFooter"></footer>
    </div>

    <div th:replace="_fragments::adminScripts"></div>
</body>

</html>
