<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="_fragments::adminHead('TRACE | Zone')"></head>

<body class="hold-transition sidebar-mini">
    <div class="wrapper">

        <nav th:replace="_fragments::adminNavbar"></nav>

        <aside th:replace="_fragments::adminSidebar('etablissements')"></aside>

        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1>Nouvelle Zone</h1>
                        </div>
                        <div class="col-sm-6">
                            <ol class="breadcrumb float-sm-right">
                                <li class="breadcrumb-item"><a href="/">Accueil</a></li>
                                <li class="breadcrumb-item"><a href="/etablissements">Établissements</a></li>
                                <li class="breadcrumb-item"><a
                                        th:href="@{'/etablissement/' + ${depot.etablissement.id} + '/depots'}">Dépôts</a>
                                </li>
                                <li class="breadcrumb-item"><a th:href="@{'/depot/' + ${depotId} + '/zones'}">Zones</a>
                                </li>
                                <li class="breadcrumb-item active">Nouveau</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Main content -->
            <section class="content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card card-primary">
                                <div class="card-header">
                                    <h3 class="card-title">Créer une Zone pour <span th:text="${depot.nom}"></span></h3>
                                </div>
                                <form th:action="@{'/depots/' + ${depotId} + '/zones/save'}" th:object="${zone}"
                                    method="post">
                                    <div class="card-body">
                                        <div class="form-group">
                                            <label for="code">Code</label>
                                            <input type="text" th:field="*{code}" class="form-control" id="code"
                                                placeholder="Ex: ZONE-001" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="nom">Nom</label>
                                            <input type="text" th:field="*{nom}" class="form-control" id="nom"
                                                placeholder="Ex: Zone Principale" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="description">Description</label>
                                            <textarea th:field="*{description}" class="form-control" id="description"
                                                placeholder="Description de la zone"></textarea>
                                        </div>
                                        <div class="form-group">
                                            <div class="custom-control custom-switch">
                                                <input type="checkbox" class="custom-control-input" id="actif"
                                                    th:field="*{actif}">
                                                <label class="custom-control-label" for="actif">Actif</label>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="card-footer text-right">
                                        <a th:href="@{'/depots/' + ${depotId} + '/zones'}"
                                            class="btn btn-default">Annuler</a>
                                        <button type="submit" class="btn btn-success">Enregistrer</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>



        <footer th:replace="_fragments::adminFooter"></footer>
    </div>

    <div th:replace="_fragments::adminScripts"></div>
</body>

</html>
